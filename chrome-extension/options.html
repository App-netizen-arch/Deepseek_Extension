<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Better DeepSeek Local Agent</title><style>body{font:14px system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px}label{display:block;margin:14px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:6px}button{margin-top:18px;padding:9px 14px;border:0;border-radius:6px}#status{margin-top:12px;min-height:20px}</style></head><body><h1>Better DeepSeek Local Agent</h1><p>All runtime data remains local. The bearer token is stored in Chrome extension storage and is sent only to 127.0.0.1.</p><label for="token">Runtime bearer token</label><input id="token" type="password" autocomplete="off" spellcheck="false"><label for="http">Runtime HTTP</label><input id="http"><label for="ws">Runtime WebSocket</label><input id="ws"><label for="codeWs">Code Agent WebSocket</label><input id="codeWs"><label for="controlHttp">Control HTTP</label><input id="controlHttp"><label for="controlWs">Control WebSocket</label><input id="controlWs"><button id="save">Save</button><button id="test">Test runtime</button><div id="status"></div><script src="options.js"></script></body></html>
