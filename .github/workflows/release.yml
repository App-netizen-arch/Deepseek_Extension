name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build browser bundles
        run: npm run build
      - name: Compute version and prepare artifact names
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            mv better-deepseek-chrome.zip better-deepseek-chrome-latest.zip
            mv better-deepseek-firefox.zip better-deepseek-firefox-latest.zip
          else
            mv better-deepseek-chrome.zip "better-deepseek-chrome-v${VERSION}.zip"
            mv better-deepseek-firefox.zip "better-deepseek-firefox-v${VERSION}.zip"
          fi
      - name: Update Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Latest automated browser-extension build from main."
          files: |
            better-deepseek-chrome-latest.zip
            better-deepseek-firefox-latest.zip
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: "Better DeepSeek browser extension release."
          files: |
            better-deepseek-chrome-v${{ steps.prep.outputs.version }}.zip
            better-deepseek-firefox-v${{ steps.prep.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
