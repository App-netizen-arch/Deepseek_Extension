name: Phase Verification

on:
  push:
    branches: [phase-0-local-runtime]
  pull_request:
    branches: [main]

jobs:
  runtime-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/package.json
      - run: npm install
      - run: npm run build
      - run: npm test
