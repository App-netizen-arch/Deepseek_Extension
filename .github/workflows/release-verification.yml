name: Release Verification

on:
  push:
    branches: [release-candidate]
  pull_request:
    branches: [main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json

      - name: Install upstream extension dependencies
        run: npm install
      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Install runtime dependencies
        working-directory: runtime
        run: npm install
      - name: Build runtime
        working-directory: runtime
        run: npm run build
      - name: Runtime tests
        working-directory: runtime
        run: npm test

      - name: Verify Chrome build output
        run: |
          test -f dist-chrome/manifest.json
          test -s dist-chrome/manifest.json

      - name: Start runtime and run security smoke tests
        env:
          BDS_RUNTIME_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BDS_RUNTIME_DB: ${{ runner.temp }}/bds-e2e.db
          BDS_WORKSPACE: ${{ github.workspace }}
          BDS_LOG_DIR: ${{ runner.temp }}/bds-logs
        run: |
          set -euo pipefail
          node runtime/dist/index.js > /tmp/bds-runtime.log 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -H "Authorization: Bearer $BDS_RUNTIME_TOKEN" http://127.0.0.1:3037/v1/status >/tmp/bds-status.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Runtime exited before becoming ready"
              cat /tmp/bds-runtime.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Runtime did not become ready within 60 seconds"
            cat /tmp/bds-runtime.log
            exit 1
          fi

          cat /tmp/bds-status.json
          BDS_RUNTIME_TOKEN=$BDS_RUNTIME_TOKEN node runtime/scripts/security-smoke.mjs
